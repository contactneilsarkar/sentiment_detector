<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sentiment Analyzer</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.10.2/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.10.2/addons/p5.sound.min.js"></script>
    <script src="https://unpkg.com/ml5@0.6.0/dist/ml5.min.js"></script>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body style="background-image: linear-gradient(#CC54CA, #4f00ff); height:100%; width: 100%;">
    <main class="app">
      <section class="card">
        <h1>Sentiment Analyzer</h1>
        <p class="subtitle">
          Enter text below and get a sentiment score from the model. This sentiment score ranges from 0 to 1, where 0 is a word that has a strongly negative connotation behind it, and 1 is a word that has a strongly positive connotation behind it.
        </p>

        <div class="controls">
          <input
            type="text"
            id="textBox"
            placeholder="Type something here..."
          />
          <button type="button" id="inputButton">Analyze</button>
        </div>

        <p id="output" class="output">Waiting for input...</p>
      </section>
    </main>

    <script src="sketch.js"></script>
  </body>
</html>
